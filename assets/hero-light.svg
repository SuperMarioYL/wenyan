<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="wenyan 文言 — per-tokenizer 中文 prompt-compression Skill for DeepSeek Qwen GLM">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf0f8"/>
    </linearGradient>
    <linearGradient id="sweepLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#14b8a6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClipLight">
      <text x="440" y="120" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="70" font-weight="800">文言 · wenyan</text>
    </clipPath>
    <radialGradient id="glowLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="280" fill="url(#bgLight)" rx="18"/>
  <ellipse cx="440" cy="112" rx="330" ry="92" fill="url(#glowLight)"/>

  <!-- floating subword tokens -->
  <g fill="#0d9488">
    <circle cx="78" cy="58" r="4"><animate attributeName="cy" values="58;50;58" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="212" r="4"><animate attributeName="cy" values="212;220;212" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="758" cy="66" r="3" fill="#7c3aed"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="222" r="3" fill="#7c3aed"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- base title (light slate) -->
  <text x="440" y="120" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="70" font-weight="800" fill="#cbd5e1">文言 · wenyan</text>
  <!-- shimmer sweep clipped to the title glyphs -->
  <g clip-path="url(#titleClipLight)">
    <rect x="-240" y="60" width="320" height="120" fill="url(#sweepLight)">
      <animate attributeName="x" values="-240;900" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline (one-shot fade-in) -->
  <text x="440" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#475569" opacity="0">per-tokenizer 中文 prompt-compression Skill
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- mini per-tokenizer variance bars (proportional token cost) -->
  <g transform="translate(300,196)" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">
    <text x="0" y="0">DeepSeek</text>
    <rect x="0" y="6" width="180" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="6" width="0" height="8" rx="4" fill="#7c3aed"><animate attributeName="width" from="0" to="180" dur="1s" begin="0.6s" fill="freeze"/></rect>
    <text x="0" y="32">Qwen</text>
    <rect x="0" y="38" width="180" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="38" width="0" height="8" rx="4" fill="#14b8a6"><animate attributeName="width" from="0" to="148" dur="1s" begin="0.9s" fill="freeze"/></rect>
    <text x="0" y="64">GLM</text>
    <rect x="0" y="70" width="180" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="70" width="0" height="8" rx="4" fill="#06b6d4"><animate attributeName="width" from="0" to="143" dur="1s" begin="1.2s" fill="freeze"/></rect>
  </g>
  <text x="440" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">same 中文 prompt · different token cost · per-model winner</text>
</svg>
