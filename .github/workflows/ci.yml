name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache HuggingFace tokenizers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tok-${{ runner.os }}-py3.12-${{ hashFiles('wenyan/models.toml') }}
          restore-keys: |
            hf-tok-${{ runner.os }}-py3.12-
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
